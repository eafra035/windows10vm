name: Build Windows VM image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag windows10-vm:latest .

      - name: Export Docker image
        run: docker save windows10-vm:latest | gzip > windows10-vm.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows10-vm-image
          path: windows10-vm.tar.gz
          retention-days: 7